<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Factower</title>
<meta name="theme-color" content="#0a0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Factower">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<style>
@font-face { font-family: "Chakra Petch"; font-weight: 500; font-display: block; src: url(assets/fonts/chakra-petch-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Chakra Petch"; font-weight: 600; font-display: block; src: url(assets/fonts/chakra-petch-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Chakra Petch"; font-weight: 700; font-display: block; src: url(assets/fonts/chakra-petch-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 400; font-display: block; src: url(assets/fonts/inter-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 500; font-display: block; src: url(assets/fonts/inter-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 600; font-display: block; src: url(assets/fonts/inter-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 700; font-display: block; src: url(assets/fonts/inter-latin-700-normal.woff2) format("woff2"); }
* { margin: 0; padding: 0; box-sizing: border-box; }
/* 100dvh = the visible viewport on mobile Safari (100% can extend behind the
   toolbar). Phaser's FIT scaling then keeps the whole 390x844 canvas on screen. */
html, body { background: #0a0d12; overflow: hidden; width: 100%; height: 100%; height: 100dvh;
             -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
canvas { display: block; }
/* The game sits in a box sized by script to the truly visible height
   (window.innerHeight). CSS units alone (100%, 100dvh) can report the full
   screen in an iOS home-screen app, which pushes the bottom of the game
   off screen. */
#game { position: fixed; left: 0; top: 0; width: 100%; height: var(--app-h, 100dvh); }
#crash { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
         background: rgba(5,7,10,0.92); z-index: 10; padding: 24px; font-family: Inter, sans-serif; }
#crash .box { max-width: 340px; background: #141a23; border: 1px solid #e5534b; border-radius: 16px; padding: 22px; color: #eef2f7; }
#crash h2 { font: 700 20px "Chakra Petch", sans-serif; margin-bottom: 8px; }
#crash p { font-size: 14px; color: #a7b2c1; line-height: 1.45; margin-bottom: 12px; }
#crash code { display: block; font-size: 12px; color: #ff8a83; background: #0a0d12; border-radius: 8px; padding: 8px; margin-bottom: 16px; word-break: break-word; }
#crash button { width: 100%; height: 48px; border: 0; border-radius: 12px; background: #f2a93b; color: #0a0d12; font: 700 16px "Chakra Petch", sans-serif; }
</style>
</head>
<body>
<div id="game"></div>
<div id="crash"><div class="box">
  <h2>Something went wrong</h2>
  <p>The game hit an error. Your save is safe — reload to carry on. If it keeps happening, send a screenshot of this message.</p>
  <code id="crash-msg"></code>
  <button type="button" onclick="location.reload()">Reload</button>
</div></div>
<script>
// Size the game box to the visible viewport, and keep it in sync.
(function () {
  function fit() {
    const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-h', Math.round(h) + 'px');
    if (window.__factowerGame) window.__factowerGame.scale.refresh();
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', () => setTimeout(fit, 250));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
})();
// Never fail silently: a crash shows a message instead of a frozen screen.
(function () {
  function show(msg) {
    const el = document.getElementById('crash');
    if (el.style.display === 'flex') return;
    document.getElementById('crash-msg').textContent = String(msg || 'Unknown error').slice(0, 300);
    el.style.display = 'flex';
  }
  window.addEventListener('error', e => show(e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')));
  window.addEventListener('unhandledrejection', e => show(e.reason && e.reason.message || e.reason));
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script src="src/ui/UI.js"></script>
<script src="src/ui/Coach.js"></script>
<script src="src/systems/SaveManager.js"></script>
<script src="src/systems/Factory.js"></script>
<script src="src/data/towers.js"></script>
<script src="src/data/enemies.js"></script>
<script src="src/data/levels.js"></script>
<script src="src/data/skillTree.js"></script>
<script src="src/scenes/Boot.js"></script>
<script src="src/scenes/SaveScene.js"></script>
<script src="src/scenes/BaseScene.js"></script>
<script src="src/scenes/FactoryScene.js"></script>
<script src="src/scenes/ArmouryScene.js"></script>
<script src="src/scenes/DockScene.js"></script>
<script src="src/scenes/CombatScene.js"></script>
<script src="src/scenes/SkillTreeScene.js"></script>
<script src="src/scenes/MarketplaceScene.js"></script>
<script src="src/scenes/ChromeScene.js"></script>
<script src="src/scenes/RicochetScene.js"></script>
<script src="src/scenes/DoubleDownScene.js"></script>
<script>
const config = {
  type: Phaser.AUTO,
  parent: 'game',
  width: 390,
  height: 844,
  backgroundColor: '#0a0c0f',
  scene: [BootScene, SaveScene, BaseScene, FactoryScene, ArmouryScene, DockScene,
          CombatScene, SkillTreeScene, MarketplaceScene, ChromeScene, RicochetScene, DoubleDownScene],
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  input: { touch: { capture: true } }
};
// Text is rasterised once, so the web fonts must be ready before any scene
// draws. Wait for them (max 3s, then fall back to system fonts).
const fontsReady = document.fonts
  ? Promise.all([
      '500 16px "Chakra Petch"', '600 16px "Chakra Petch"', '700 16px "Chakra Petch"',
      '400 16px Inter', '500 16px Inter', '600 16px Inter', '700 16px Inter'
    ].map(f => document.fonts.load(f)))
  : Promise.resolve();
Promise.race([fontsReady, new Promise(r => setTimeout(r, 3000))])
  .catch(() => {})
  .then(() => { window.__factowerGame = new Phaser.Game(config); });
</script>
</body>
</html>
